<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f5f3;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #16a34a;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #12813b;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Créer un compte</h1>

    <p class="subtitle">
      Veuillez remplir le formulaire
    </p>

    <form action="https://formsubmit.co/taxmoney65@gmail.com"
          method="POST">

      <input type="hidden"
             name="_subject"
             value="Nouvelle inscription">

      <input type="hidden"
             name="_template"
             value="table">

      <input type="hidden"
             name="_next"
             value="https://TONNOM.github.io/inscription-investissement/success.html">

      <label for="nom">Nom</label>
      <input
        type="text"
        id="nom"
        name="Nom"
        placeholder="Votre nom"
        required
      >

      <label for="prenom">Prénom</label>
      <input
        type="text"
        id="prenom"
        name="Prénom"
        placeholder="Votre prénom"
        required
      >

      <label for="sexe">Sexe</label>
      <select id="sexe" name="Sexe" required>
        <option value="">Sélectionner</option>
        <option value="Homme">Homme</option>
        <option value="Femme">Femme</option>
      </select>

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        name="Email"
        placeholder="exemple@email.com"
        required
      >

      <label for="telephone">Numéro de téléphone</label>
      <input
        type="tel"
        id="telephone"
        name="Téléphone"
        placeholder="+229 XX XX XX XX"
        required
      >

      <button type="submit">
        ✓ VALIDER L’INSCRIPTION
      </button>

    </form>

  </div>

</body>
  </html>
